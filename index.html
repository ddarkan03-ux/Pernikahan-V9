<style>
:root{--bg:#f7f5f0;--bg2:#edf2f1;--ink:#46525a;--mu:#7b878d;--ac:#7f9f9a;--ac2:#a9c0bd;--sd:#ebe5da;--bl:#dde8ec;--wh:#fffefb}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#e4e8e6;font:300 15px/1.9 'Nunito Sans',system-ui,sans-serif;color:var(--ink)}
.app{max-width:480px;margin:auto;background:var(--bg);min-height:100vh;position:relative;overflow-x:clip}
h1,h2,h3,h4{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;margin:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
section{padding:88px 28px;text-align:center;position:relative}section.b2{background:var(--bg2)}
.eb{font:400 11px 'Nunito Sans';letter-spacing:5px;text-transform:uppercase;color:var(--ac)}
section h2{font-size:38px;line-height:1.2;margin:10px 0 0;color:var(--ink)}
.dv{display:flex;align-items:center;justify-content:center;gap:8px;margin:20px auto 28px}.dv i{width:5px;height:5px;border-radius:50%;background:var(--ac2)}.dv i:nth-child(2){width:8px;height:8px;background:var(--ac)}
.sub{color:var(--mu);margin:0 auto 26px;max-width:34ch}
[data-r]{opacity:0;transform:translateY(14px);transition:opacity 1.8s ease var(--d,0s),transform 1.8s ease var(--d,0s)}[data-r].in{opacity:1;transform:none}
.bt{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--ac);color:#fff;padding:12px 26px;font:400 14px 'Nunito Sans';border-radius:99px;cursor:pointer;text-decoration:none;margin:5px;transition:background .6s,box-shadow .6s}
.bt:hover{background:#6d8f89}.bt.o{background:none;color:var(--ac);box-shadow:inset 0 0 0 1.2px var(--ac)}.bt.o:hover{background:var(--ac);color:#fff}
:is(.bt,input,select,textarea,a,button):focus-visible{outline:2px solid var(--ac);outline-offset:3px}
/* cover */
#cover{position:fixed;inset:0;max-width:480px;margin:auto;z-index:60;display:flex;align-items:center;justify-content:center;padding:26px;background:var(--bl);transition:opacity 1.6s ease;overflow:hidden}
#cover.off{opacity:0;pointer-events:none}#cover.gone{display:none}
#cover .bgc{position:absolute;inset:0;background:center 38%/cover;animation:sz 24s ease-in-out infinite alternate}

.cd0{position:relative;width:100%;max-width:340px;text-align:center;background:#fffefbcc;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:32px;padding:34px 24px 30px;box-shadow:0 20px 60px #46525a26;animation:fi 2s ease both}

.cd0 .tg{font-size:13px;letter-spacing:2px;color:var(--mu);margin:0 0 18px}
.cd0 .gb{border-top:1px solid #7f9f9a40;border-bottom:1px solid #7f9f9a40;padding:12px 0;margin:0 0 20px}.gb small{font-size:12px;color:var(--mu)}.gb b{display:block;font:500 23px/1.3 'Cormorant Garamond',serif;overflow-wrap:anywhere}
.cd0 .bt{padding:13px 30px;animation:br 5s ease-in-out infinite}

.cd0 .nt{font-size:12px;color:var(--mu);margin:16px 0 0;line-height:1.7}
/* hero */
.hero{padding:0;background:var(--bg)}
.hp{position:relative;height:max(440px,62vh);border-radius:0 0 50% 50%/0 0 90px 90px;overflow:hidden;background:var(--bl)}
.sl{position:absolute;inset:0;background:center 38%/cover;opacity:0;transition:opacity 3s ease}.sl.on{opacity:1}
.hp:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#46525a33,#0000 30%)}

.pil{display:inline-block;padding:8px 22px;border-radius:99px;background:var(--bl);font-size:14px;color:var(--ink)}

.sc{display:block;margin:22px auto 0;color:var(--ac);animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(6px)}}

.ev{background:var(--wh);border-radius:28px;padding:30px 22px;margin:16px 0;box-shadow:0 12px 40px #46525a14}.ev .big{width:30px;height:30px;color:var(--ac);stroke-width:1.2}
.ev h3{font-size:28px;margin:6px 0}.ev p{margin:4px 0}.ev .dt{font:500 19px 'Cormorant Garamond',serif}.ev small{color:var(--mu)}
.ev .bw{margin-top:14px}
/* kisah */
.tl{position:relative;text-align:left;padding-left:26px;max-width:400px;margin:0 auto}.tl:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--ac2)}
.tl>div{position:relative;margin-bottom:30px}.tl>div:before{content:"";position:absolute;left:-26px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--bg2);box-shadow:0 0 0 1.5px var(--ac)}
.tl .y{font-size:12px;letter-spacing:3px;color:var(--ac)}.tl h4{font-size:24px;margin:2px 0 4px}.tl p{margin:0;color:var(--mu);font-size:14px}

.sld{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px calc(50% - 130px) 20px;margin:0 -28px;scrollbar-width:none}.sld::-webkit-scrollbar{display:none}
.sld img{flex:0 0 260px;width:260px;min-width:0;max-width:none;height:auto;align-self:flex-start;scroll-snap-align:center;aspect-ratio:4/5;object-fit:cover;border-radius:26px;background:var(--sd);box-shadow:0 12px 34px #46525a1f;cursor:pointer}
.dots{display:flex;gap:10px;justify-content:center;align-items:center}.dots button{width:8px;height:8px;border-radius:50%;border:0;background:var(--ac2);padding:0;cursor:pointer;transition:.6s}.dots button.on{background:var(--ac);transform:scale(1.4)}
.dots .ar2{width:40px;height:40px;background:none;box-shadow:inset 0 0 0 1px var(--ac2);color:var(--ac);display:grid;place-items:center;margin:0 10px;transform:none}
#lb{position:fixed;inset:0;background:#2a3438ea;z-index:80;display:none;align-items:center;justify-content:center}#lb img{max-width:92%;max-height:88%;border-radius:14px}
/* hadiah */
.gf{background:var(--bl);border-radius:26px;padding:24px 20px;margin:16px 0}.gf small{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mu)}.gf .no{display:block;font:500 28px/1.4 'Cormorant Garamond',serif;letter-spacing:2px;margin:6px 0;overflow-wrap:anywhere}.gf .an{font-size:14px;color:var(--mu)}
.gf .bt{margin-top:12px}
/* form */
form.cd2{background:var(--wh);border-radius:28px;padding:26px 22px;margin:16px 0;box-shadow:0 12px 40px #46525a14;text-align:left}form h4{font-size:27px;text-align:center}.ps{font-size:13px;color:var(--mu);text-align:center;margin:2px 0 6px}
label.l{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);margin:18px 0 6px}
input[type=text],textarea{width:100%;padding:13px 16px;border:1px solid #7f9f9a55;border-radius:16px;font:inherit;background:var(--bg);color:var(--ink)}textarea{resize:vertical}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pills label{cursor:pointer}.pills input{position:absolute;opacity:0;pointer-events:none}.pills span{display:block;padding:9px 18px;border-radius:99px;background:var(--bg);box-shadow:inset 0 0 0 1px #7f9f9a55;font-size:14px;transition:.5s}.pills input:checked+span{background:var(--ac);color:#fff;box-shadow:none}.pills input:focus-visible+span{outline:2px solid var(--ac);outline-offset:2px}
.st{font-size:13px;margin-top:12px;min-height:20px;color:var(--ac);text-align:center}
#msgs{max-height:380px;overflow:auto;margin-top:20px;text-align:left}#msgs .m{background:var(--wh);border-radius:20px;padding:14px 16px;margin:12px 0;font-size:14px;box-shadow:0 6px 20px #46525a10}#msgs b{font-weight:600}#msgs small{color:var(--mu)}
ol.kl{text-align:left;padding-left:22px;max-width:340px;margin:0 auto 18px}ol.kl li::marker{color:var(--ac)}
/* penutup */
.pen{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:60px 28px 120px;overflow:hidden;color:#fff;background:var(--ac)}
.pen .pb{position:absolute;inset:0;background:center 30%/cover}.pen .po{position:absolute;inset:0;background:linear-gradient(180deg,#46525a55,#0000 32%,#394549b3 68%,#2f3a3e)}.pen .pc{position:relative;z-index:1}
.pen h2{font-size:clamp(42px,13vw,58px);color:#fff;margin:14px 0}.pen h2 i{font-weight:400;color:var(--bl)}.pen p{color:#eef3f2;max-width:34ch;margin:0 auto 10px}.pen .eb{color:var(--bl)}
/* dock */
#dock{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(420px,92vw);display:flex;justify-content:space-around;background:#fffefbe6;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:26px;padding:8px 4px;z-index:40;box-shadow:0 10px 36px #46525a29}
#dock a{flex:1;text-align:center;color:var(--mu);text-decoration:none;font-size:10px;padding:4px 2px;transition:color .6s}#dock a .ic{display:block;margin:0 auto 1px}#dock a.on{color:var(--ac)}
#mus{position:fixed;top:14px;right:max(14px,calc(50% - 226px));z-index:41;width:42px;height:42px;border-radius:50%;border:0;background:#fffefbcc;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--ac);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 16px #46525a22}
#mus .p{display:none}#mus.play .p{display:block}#mus.play .m{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto}[data-r]{opacity:1;transform:none}.sl{opacity:0}.sl.on{opacity:1}}
.bs{font-family:'Edwardian Script ITC',Amiri,serif;font-size:32px}
.bs{color:#a09c94;font-size:25px}
</style></head><body>

<div id="cover" role="dialog" aria-label="Sampul undangan"><div class="bgc" id="cvbg"></div><div class="ovc"></div>
<div class="cd0"><span class="eb">Undangan Pernikahan</span><h1 id="cn"></h1><p class="tg" id="ctg"></p><div class="gb"><small>Kepada Yth. Bapak/Ibu/Saudara/i</small><b id="tm"></b></div><button class="bt" id="open">Buka Undangan</button><p class="nt">Luangkan waktu sejenak.<br>Undangan ini dibuat untuk dinikmati dengan tenang.</p></div></div>
<div class="app" id="app"></div><button id="mus" aria-label="Musik" hidden><svg class="ic m"><use href="#i-music"/></svg><svg class="ic p"><use href="#i-pause"/></svg></button><div id="lb"><img alt=""></div><audio id="au" loop></audio>

<script>
const D=DATA_UNDANGAN,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],e=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const OFF={WIB:'+07:00',WITA:'+08:00',WIT:'+09:00'},BLN='Januari Februari Maret April Mei Juni Juli Agustus September Oktober November Desember'.split(' '),HR='Minggu Senin Selasa Rabu Kamis Jumat Sabtu'.split(' ');
const when=a=>new Date(`${a.tanggal}T${a.jam}:00${OFF[a.zona]||'+07:00'}`);
const tgl=a=>{const d=new Date(a.tanggal+'T12:00:00Z');return `${HR[d.getUTCDay()]}, ${d.getUTCDate()} ${BLN[d.getUTCMonth()]} ${d.getUTCFullYear()}`};
const P=D.pria,W=D.wanita,Q=new URLSearchParams(location.search).get('to')||'',tamu=Q||'Nama Tamu';
const ic=(n,c)=>`<svg class="ic ${c||''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const url=u=>`url('${String(u||'').replace(/["'\\]/g,'')}')`;
const R=d=>`data-r${d?` style="--d:${d}s"`:''}`;
const sec=(id,lb,t,h,c)=>`<section id="${id}" data-t="${e(lb)}"${c?` class="${c}"`:''}><div class="eb" ${R()}>${lb}</div><h2 ${R(.15)}>${t}</h2><div class="dv" ${R(.3)}><i></i><i></i><i></i></div>${h}</section>`;
const z=d=>d.toISOString().replace(/[-:]|\.\d+/g,'');
const calu=(t,a)=>{const s=when(a);return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t+' '+P.panggilan+' & '+W.panggilan)}&dates=${z(s)}/${z(new Date(+s+36e5*3))}&location=${encodeURIComponent(a.tempat+', '+a.alamat)}`};
const evt=(t,a,ik)=>`<div class="ev" ${R()}>${ic(ik,'big')}<h3>${t}</h3><p class="dt">${tgl(a)}</p><p>Pukul ${e(a.jam)} ${e(a.zona)}${a.selesai?' – Selesai':''}</p><p><b style="font-weight:600">${e(a.tempat)}</b><br><small>${e(a.alamat)}</small></p><div class="bw">${a.maps?`<a class="bt o" target="_blank" rel="noopener" href="${e(a.maps)}">${ic('pin')}Lihat Lokasi</a>`:''}<a class="bt" target="_blank" rel="noopener" href="${calu(t,a)}">${ic('cal')}Simpan di Kalender</a></div></div>`;
const cp=(p,r)=>`<div class="cp" ${R()}><div class="rf"><div style="background-image:${url(r)}" role="img" aria-label="${e(p.nama)}"></div></div><h3>${e(p.nama)}</h3><p>${e(p.anakKe||'')} dari pasangan<br><b>${e(p.ayah)}</b> &amp; <b>${e(p.ibu)}</b><br><small>${e(p.domisili)}</small></p></div>`;
const rk=(D.hadiah.rekening||[]).slice(0,2),kl=D.keluarga&&D.keluarga.aktif?D.keluarga.daftar||[]:[];
const salin=(t,n)=>`<button class="bt o" data-cp="${e(n)}">${ic('copy')}${t}</button>`;
const slides=[...new Set([D.foto.cover,...(D.galeri||[])].filter(Boolean))].slice(0,4);
let h=`<section id="home" data-t="Beranda" class="hero"><div class="hp">${slides.map((s,i)=>`<div class="sl${i?'':' on'}" style="background-image:${url(s)}"></div>`).join('')}</div>
<div class="hi"><p class="bs" ${R()}>Assalamualaikum Wr.Wb</p><div class="eb" ${R(.2)}>Undangan Pernikahan</div><h1 ${R(.4)}>${e(W.panggilan)} <i>&amp;</i> ${e(P.panggilan)}</h1><span class="pil" ${R(.6)}>${tgl(D.akad)}${D.akad.kota?' · '+e(D.akad.kota):''}</span><div class="gs" ${R(.8)}>Dengan penuh rasa syukur, kami mengundang<b>${e(tamu)}</b></div><span class="sc" aria-hidden="true">${ic('dn')}</span></div></section>`;
if(D.kutipan)h+=`<section id="kutipan" class="b2" data-t="Ayat"><p class="ar" ${R()}>${e(D.kutipan.arab)}</p><p class="qt" ${R(.3)}>"${e(D.kutipan.arti)}"</p><div class="src" ${R(.5)}>${e(D.kutipan.sumber)}</div></section>`;
h+=sec('mempelai','Mempelai','Dua Hati, Satu Langkah',`<p class="sub" ${R()}>Dengan memohon rahmat dan ridho Allah Subhanahu wa Ta'ala, kami bermaksud menyelenggarakan syukuran pernikahan putra-putri kami.</p>${cp(W,D.foto.mempelaiWanita)}<div class="am" ${R()}>&amp;</div>${cp(P,D.foto.mempelaiPria)}`);
h+=sec('acara','Hari Bahagia','Waktu & Tempat',`<p class="sub" ${R()}>Tidak perlu terburu-buru. Berikut waktu dan tempat yang kami siapkan dengan sepenuh hati.</p><div class="cd" id="cd" ${R()}></div>${evt('Akad Nikah',D.akad,'ring')}${D.resepsi&&D.resepsi.aktif?evt('Resepsi',D.resepsi,'heart'):''}${D.live?`<a class="bt o" target="_blank" rel="noopener" href="${e(D.live)}">${ic('play')}Siaran Langsung</a>`:''}`,'b2');
if(D.kisah&&D.kisah.length)h+=sec('kisah','Perjalanan','Kisah Kami',`<div class="tl">${D.kisah.map(k=>`<div ${R()}><div class="y">${e(k.tahun)}</div><h4>${e(k.judul)}</h4><p>${e(k.isi)}</p></div>`).join('')}</div>`);
if(D.galeri&&D.galeri.length)h+=sec('galeri','Momen','Galeri Foto',`<div class="sld" id="sld" ${R()}>${D.galeri.map(g=>`<img loading="lazy" src="${e(g)}" alt="Foto prewedding" onerror="this.style.visibility='hidden'">`).join('')}</div><div class="dots" id="dots"><button class="ar2" id="pv" aria-label="Sebelumnya">${ic('l')}</button>${D.galeri.map((g,i)=>`<button aria-label="Foto ${i+1}"></button>`).join('')}<button class="ar2" id="nx" aria-label="Berikutnya">${ic('r')}</button></div>`,'b2');
if(D.tampil.hadiah&&(rk.length||D.hadiah.alamatKado))h+=sec('hadiah','Tanda Kasih','Kado Digital',`<p class="sub" ${R()}>Kehadiran dan doa Anda sudah lebih dari cukup bagi kami. Jika berkenan memberikan tanda kasih, berikut informasinya.</p>${rk.map(r=>`<div class="gf" ${R()}><small>${e(r.label)} · ${e(r.jenis)}</small><span class="no">${e(r.nomor)}</span><div class="an">a.n. ${e(r.nama)}</div>${salin('Salin Nomor',r.nomor)}</div>`).join('')}${D.hadiah.alamatKado?`<div class="gf" ${R()}><small>Kirim Kado Fisik</small><div class="an" style="margin-top:8px">Penerima: <b>${e(D.hadiah.penerima||'')}</b><br>${e(D.hadiah.alamatKado)}</div>${salin('Salin Alamat',D.hadiah.alamatKado)}</div>`:''}`);
const pl=(n,o)=>`<div class="pills" role="radiogroup">${o.map((x,i)=>`<label><input type="radio" name="${n}" value="${x[0]}"${i?'':' checked'}><span>${x[1]}</span></label>`).join('')}</div>`;
const HD=[['hadir','Insya Allah hadir'],['ragu','Belum pasti'],['tidak','Berhalangan']];
h+=sec('ucapan','RSVP & Doa','Kabar dari Anda',`<p class="sub" ${R()}>Tidak ada jawaban yang salah. Beri tahu kami kapan pun Anda siap, dan jika rencana berubah, Anda boleh mengisinya lagi.</p>
<form id="f1" class="cd2" ${R()}><h4>Konfirmasi Kehadiran</h4><p class="ps">Cukup beberapa detik saja.</p><label class="l" for="n1">Nama</label><input type="text" id="n1" maxlength="40" required value="${e(Q)}"><label class="l">Kehadiran</label>${pl('hd1',HD)}<div id="jw"><label class="l">Jumlah Tamu</label>${pl('jm1',[1,2,3,4].map(i=>[i,i+' orang']))}</div><div style="text-align:center;margin-top:22px"><button class="bt">${ic('send')}Kirim Konfirmasi</button></div><div class="st" id="st1" role="status"></div></form>
<form id="f2" class="cd2" ${R()}><h4>Ucapan & Doa</h4><p class="ps">Satu kalimat sederhana pun sangat berarti.</p><label class="l" for="n2">Nama</label><input type="text" id="n2" maxlength="40" required value="${e(Q)}"><label class="l">Kehadiran</label>${pl('hd2',HD)}<label class="l" for="p2">Ucapan <span id="ct">(0/300)</span></label><textarea id="p2" maxlength="300" rows="4" required></textarea><div style="text-align:center;margin-top:22px"><button class="bt">${ic('send')}Kirim Ucapan</button></div><div class="st" id="st2" role="status"></div></form><div id="msgs"></div>`,'b2');
if(kl.length)h+=sec('turut-mengundang','Segenap Keluarga','Turut Mengundang',`<p class="sub" ${R()}>Dengan rasa hormat dan terima kasih kepada segenap keluarga besar, alim ulama, tokoh masyarakat, dan handai taulan:</p><ol class="kl" ${R()}>${kl.map((k,i)=>`<li${i>=8?' hidden data-x':''}>${e(k)}</li>`).join('')}</ol>${kl.length>8?'<button class="bt o" id="more">Lihat Selengkapnya</button>':''}`);
const PN=D.foto.penutup||'';
h+=`<section id="penutup" data-t="Penutup" class="pen">${PN?`<div class="pb" style="background-image:${url(PN)}" role="img" aria-label="Foto penutup"></div><div class="po"></div>`:''}<div class="pc"><div class="eb" ${R()}>Terima Kasih</div><h2 ${R(.2)}>${e(W.panggilan)} <i>&amp;</i> ${e(P.panggilan)}</h2><p ${R(.4)}>Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir untuk memberikan doa restu kepada kedua mempelai.</p><p ${R(.6)}>Wassalamu'alaikum Wr. Wb.</p>${D.demo?'<small style="opacity:.8">Data contoh (DEMO)</small>':''}</div></section>`;
$('#app').innerHTML=h+'<nav id="dock" aria-label="Menu"></nav>';
const IC={home:['home','Beranda'],mempelai:['heart','Mempelai'],acara:['cal','Acara'],galeri:['img','Foto'],hadiah:['gift','Kado'],ucapan:['msg','RSVP']};
$('#dock').innerHTML=$$('section').filter(s=>IC[s.id]).map(s=>`<a href="#${s.id}" data-s="${s.id}">${ic(IC[s.id][0])}${IC[s.id][1]}</a>`).join('');
$('#cn').innerHTML=`${e(W.panggilan)} <i>&amp;</i> ${e(P.panggilan)}`;$('#ctg').textContent=tgl(D.akad);$('#tm').textContent=tamu;$('#cvbg').style.backgroundImage=url(D.foto.cover);document.body.style.overflow='hidden';
const au=$('#au');if(D.musik){au.src=D.musik;au.volume=.6;$('#mus').hidden=false}
$('#open').onclick=()=>{const c=$('#cover');c.classList.add('off');document.body.style.overflow='';if(D.musik)au.play().catch(()=>{});setTimeout(()=>c.classList.add('gone'),1700)};
$('#mus').onclick=()=>au.paused?au.play():au.pause();au.onplay=()=>$('#mus').classList.add('play');au.onpause=()=>$('#mus').classList.remove('play');
const ob=new IntersectionObserver(a=>a.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');ob.unobserve(x.target)}}),{threshold:.1});$$('[data-r]').forEach(s=>ob.observe(s));
const nv=new IntersectionObserver(a=>a.forEach(x=>{if(x.isIntersecting){const id=x.target.id==='kutipan'?'home':x.target.id;$$('#dock a').forEach(l=>l.classList.toggle('on',l.dataset.s===id))}}),{rootMargin:'-45% 0px -50% 0px'});$$('section').forEach(s=>nv.observe(s));
const SL=$$('.sl');if(SL.length>1){let k=0;setInterval(()=>{SL[k].classList.remove('on');k=(k+1)%SL.length;SL[k].classList.add('on')},8000)}
const T=when(D.akad);setInterval(function t(){let s=Math.max(0,(T-Date.now())/1000|0);$('#cd').innerHTML=[['hari',86400],['jam',3600],['menit',60],['detik',1]].map(([l,m])=>{const v=s/m|0;s-=v*m;return `<div><b>${String(v).padStart(2,'0')}</b><small>${l}</small></div>`}).join('');return t}(),1000);
$$('[data-cp]').forEach(b=>{const o=b.innerHTML;b.onclick=()=>navigator.clipboard.writeText(b.dataset.cp).then(()=>{b.innerHTML=ic('copy')+'Tersalin';setTimeout(()=>b.innerHTML=o,1800)},()=>b.textContent='Salin manual')});
$('#lb').onclick=()=>$('#lb').style.display='none';
if($('#more'))$('#more').onclick=function(){$$('[data-x]').forEach(l=>l.hidden=false);this.remove()};
const sld=$('#sld');if(sld){const im=[...sld.querySelectorAll('img')],dt=[...$('#dots').querySelectorAll('button:not(.ar2)')];let cur=0;
const go=i=>{cur=(i+im.length)%im.length;sld.scrollTo({left:im[cur].offsetLeft-(sld.clientWidth-im[cur].clientWidth)/2,behavior:'smooth'})};
const io=new IntersectionObserver(a=>a.forEach(x=>{if(x.isIntersecting){const i=im.indexOf(x.target);dt.forEach((d,j)=>d.classList.toggle('on',i===j));cur=i}}),{root:sld,threshold:.6});im.forEach(m=>io.observe(m));
$('#pv').onclick=()=>go(cur-1);$('#nx').onclick=()=>go(cur+1);dt.forEach((d,i)=>d.onclick=()=>go(i));im.forEach(m=>m.onclick=()=>{$('#lb img').src=m.src;$('#lb').style.display='flex'});dt[0].classList.add('on')}
$('#p2').oninput=()=>$('#ct').textContent=`(${$('#p2').value.length}/300)`;
$$('input[name=hd1]').forEach(r=>r.onchange=()=>$('#jw').style.display=$('input[name=hd1]:checked').value=='hadir'?'':'none');
let show=D.tampil.ucapan;
async function muat(){const m=$('#msgs');if(!FB.ok())return;try{const c=await FB.pengaturan();if(c.ucapan!==undefined)show=c.ucapan;if(!show)return;m.innerHTML=(await FB.ucapan()).filter(u=>u.pesan).map(u=>`<div class="m"><b>${e(u.nama)}</b> <small>· ${u.hadir=='hadir'?'Hadir':u.hadir=='tidak'?'Berhalangan':'Belum pasti'}</small><br>${e(u.pesan)}</div>`).join('')}catch(x){m.textContent='Ucapan belum dapat dimuat.'}}muat();
async function kirim(ev,id){ev.preventDefault();const st=$('#st'+id);if(!FB.ok()){st.textContent='Firebase belum dikonfigurasi.';return}st.textContent='Sebentar ya…';
const hd=$(`input[name=hd${id}]:checked`).value;try{await FB.kirim({nama:$('#n'+id).value.trim().slice(0,40),hadir:hd,jumlah:id==1&&hd=='hadir'?+$('input[name=jm1]:checked').value:0,pesan:id==2?$('#p2').value.trim().slice(0,300):''});st.textContent=id==1?'Terima kasih, konfirmasi Anda sudah kami terima ♡':'Terima kasih atas doa dan ucapannya ♡';if(id==2){$('#p2').value='';muat()}}catch(x){st.textContent='Maaf, belum berhasil terkirim: '+x.message}}
$('#f1').onsubmit=v=>kirim(v,1);$('#f2').onsubmit=v=>kirim(v,2);
</script></body></html>
